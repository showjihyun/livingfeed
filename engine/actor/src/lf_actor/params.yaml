# Actor Runtime 파라미터 — 단일 파일 (emotion/goal params.yaml 선례).
# 튜닝 대상 수치는 코드가 아니라 여기에 있다 (하드코딩 금지).

# SNS 포스팅 리듬 (rhythm.posting_moment) — "이 tick이 근황을 남기고 싶은 순간인가"
rhythm:
  # 휴일 (ISO 날짜 목록) — 이 날은 요일과 무관하게 주말처럼 동작한다
  holidays: []
  # 생활 패턴별 프로파일.
  #   busy: 평일 일과 창(시각) — [start, end). start > end면 자정을 넘는 창(night_worker).
  #         주말·휴일엔 무시된다. null이면 일과 억제가 없다.
  #   daily_posts: 하루 목표 모먼트 수 (weekday 평일 / weekend 주말·휴일)
  lifestyles:
    office_worker:
      busy: { start: 9, end: 18 }
      daily_posts: { weekday: 2, weekend: 5 }
    teacher:
      busy: { start: 8, end: 17 }
      daily_posts: { weekday: 2, weekend: 5 }
    student:
      busy: { start: 8, end: 16 }
      daily_posts: { weekday: 3, weekend: 6 }
    night_worker:
      busy: { start: 22, end: 7 }
      daily_posts: { weekday: 3, weekend: 4 }
    flexible:
      busy: null
      daily_posts: { weekday: 4, weekend: 5 }

# 도파민 포인트 (plan/02·03) — 관계가 보상이 되는 순간들 (outreach.py / phases.py)
outreach:
  # 첫 접촉 인사 — 엣지 없는 플레이어의 첫 좋아요에 남기는 인사 댓글, 액터당 tick당 상한
  greeting_max_per_tick: 1
  # 선제 DM 관계 임계 — 플레이어 엣지의 trust+intimacy 합이 이 이상일 때만 (plan/02 '기억됨')
  dm_threshold: 0.5
  # (액터,플레이어)당 선제 DM 최소 간격 — 세계 하루(360 tick) 1회 이하
  dm_cooldown_ticks: 360
  # 선제 DM 기회 창 — LOD·리듬과 독립된 액터별 검사 주기 (위상 분산).
  # 빈도의 빗장은 쿨다운이고, 이 값은 자격이 생긴 뒤의 지연 상한일 뿐이다
  dm_check_ticks: 30

# 드라마 재생산 여운 (resonance.py / phases.py) — 강렬했던 플레이어 댓글 교환이
# 며칠 안에 원 대화의 correlation을 승계한 후속 포스트로 분출된다 (plan/02 §측정)
resonance:
  # 여운이 남는 감정 강도 임계 — shift 발행 임계(emotion params instance_intensity
  # 0.3)의 2배. 댓글의 base_intensity(0.45)에 성격 변조·재강화가 얹혀야 닿는
  # 수준이다: 밋밋한 댓글 한 번은 남지 않고, 예민·외향 인물이나 이어진 교환만
  # 여운이 된다 (보수적 시작 — 후속 포스트는 희소해야 서사다)
  threshold: 0.6
  # 여운 수명 (tick) — 넘기면 바랜 것: 분출하지 않고 지운다. 90 tick = 세계 6시간,
  # 리듬 모먼트 0~2회의 기회 창 — 못 만나면 그 여운은 조용히 사라진다 (허용 오차)
  ttl_ticks: 90
  # 분출 쿨다운 (액터당, tick) — 후속 포스트는 희소해야 배지가 서사가 된다
  # (소셜 루프 과열의 교훈). ttl보다 짧게 — 다음 여운의 분출 창을 구조적으로
  # 없애지 않는다 (쿨다운 > ttl이면 연속 여운이 영영 못 터진다)
  cooldown_ticks: 60

# 액터 소셜 루프 (social.py / phases.py) — 피드 순환·댓글 예산
social:
  # 포스트 하나가 배달되는 이웃 수 — 관계 salience 상위 N (관계 전무 시 결정적 해시 N)
  feed_fanout: 3
  # 액터당 tick당 자발 댓글 상한 — 루프 폭주의 마지막 빗장
  max_comments_per_tick: 1
  # 자발 댓글 쿨다운 — 방금 댓글 단 액터는 이 tick 수만큼 기회 창이 닫힌다.
  # 댓글마다 작성자의 답장이 따라오므로 이 창이 곧 수다(와 LLM 비용)의 예산이다
  comment_cooldown_ticks: 5
  # 다음 LLM decide까지 들고 가는 '본 글' 최대 수 — 오래된 것부터 밀려난다
  seen_posts_max: 3
