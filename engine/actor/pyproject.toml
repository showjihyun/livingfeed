[project]
name = "lf-actor"
version = "0.1.0"
description = "Actor Runtime — asyncio 워커 풀 + 해시 샤딩 (ADR-012)"
requires-python = ">=3.12"
dependencies = [
    "lf-schemas",
    "lf-eventstore",
    "lf-tick",
    "lf-emotion",
    "lf-relationship",
    "lf-goal",
    # 메시징 토폴로지(DLQ subject 규칙)의 유일 구현을 재사용한다 (ADR-017 §3)
    "lf-dispatcher",
    "nats-py>=2.9",
    "redis>=5.0",
    "pyyaml>=6.0",
    # Semantic 기억(Qdrant REST) — 무거운 SDK 회피 (ADR-007/008)
    "httpx>=0.27",
]

[tool.uv.sources]
lf-schemas = { workspace = true }
lf-eventstore = { workspace = true }
lf-tick = { workspace = true }
lf-emotion = { workspace = true }
lf-relationship = { workspace = true }
lf-goal = { workspace = true }
lf-dispatcher = { workspace = true }
lf-ai-runtime = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    # 통합 테스트에서 AI Runtime을 in-process로 띄우기 위한 dev 전용 의존
    "lf-ai-runtime",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_actor"]
