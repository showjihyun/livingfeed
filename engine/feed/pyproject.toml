[project]
name = "lf-feed"
version = "0.1.0"
description = "Feed Engine — 편집(feed-worthiness) + 랭킹 로직 (ADR-014)"
requires-python = ">=3.12"
dependencies = [
    "lf-schemas",
    "lf-eventstore",
    # 메시징 토폴로지(subject/stream/DLQ 규칙)의 유일 구현을 재사용한다 (ADR-017 §3)
    "lf-dispatcher",
    "nats-py>=2.9",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[tool.uv.sources]
lf-schemas = { workspace = true }
lf-eventstore = { workspace = true }
lf-dispatcher = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_feed"]
