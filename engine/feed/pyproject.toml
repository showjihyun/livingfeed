[project]
name = "lf-feed"
version = "0.1.0"
description = "Feed Engine — 편집(feed-worthiness) + 랭킹 로직 (ADR-014)"
requires-python = ">=3.12"
dependencies = [
    "lf-schemas",
]

[tool.uv.sources]
lf-schemas = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_feed"]
