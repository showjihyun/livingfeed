[project]
name = "lf-tick"
version = "0.1.0"
description = "Tick Engine — 이산 tick + LOD 스케줄링 (ADR-011)"
requires-python = ">=3.12"
dependencies = [
    "lf-schemas",
]

[tool.uv.sources]
lf-schemas = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_tick"]
