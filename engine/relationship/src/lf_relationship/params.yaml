# Relationship Engine 파라미터 — 단일 파일 (ADR-016 완화책: 델타 튜닝 중앙화)
# 리플레이 기반 A/B 튜닝 대상. 코드에 수치 하드코딩 금지.

# 상호작용 효과 (ADR-016 갱신 규칙 1): 사건 → 방향별 차원 델타.
#   outgoing = 행위자(from)→대상(to) 엣지에 적용 (내가 그에게 한 일이 내 마음을 바꾼다)
#   incoming = 대상(from)→행위자(to) 엣지에 적용 (그가 내게 한 일)
interaction_effects:
  # 플레이어 개입 — 액터→플레이어 엣지(incoming 시점)만 갱신한다
  player.dm.sent:
    incoming: { trust: 0.04, intimacy: 0.05, salience: 0.08 }
  player.comment.posted:
    incoming: { trust: 0.03, intimacy: 0.03, salience: 0.06 }
  player.reaction.added:
    incoming: { intimacy: 0.01, salience: 0.03 }
  # 액터끼리 오간 말 (actor.message.sent 중 target_actor_id 분 — 갱신 규칙 1c).
  # 댓글은 액터의 일상이라 player.comment.posted(드문 외부 개입)보다 약하게 —
  # 매 교환이 우정이 되면 세계 전원이 절친이 되어 관계가 서사를 잃는다.
  # incoming > outgoing: 받은 말이 더 남는다 (help·confess의 incoming 우위 관례).
  # 성장 어림 (과열 가드): 댓글 쿨다운 5tick·액터당 tick당 1건 + 작성자 답장
  # 1건이 상한이라, 최빈 쌍의 수신 엣지도 교환(5tick)당 trust +0.025가 최대 —
  # '믿고 가까운' 임계(trust 0.25)까지 연속 교환 10회(≈50tick)가 하한이고,
  # 실제로는 이웃 분산(fanout 3)·LLM의 댓글 선택으로 수백 tick이다. intimacy는
  # 감쇠(0.0003/tick)가 있어 교환이 끊기면 도로 식는다 — 균형 유지
  actor.message.sent:
    outgoing: { trust: 0.01, intimacy: 0.01, salience: 0.04 }
    incoming: { trust: 0.015, intimacy: 0.02, salience: 0.05 }
  # 액터 행동 (actor.action.performed의 action_kind) — 양방향
  action.speak:
    outgoing: { intimacy: 0.03, trust: 0.02, salience: 0.05 }
    incoming: { intimacy: 0.02, salience: 0.04 }
  action.help:
    outgoing: { intimacy: 0.03, respect: 0.02, salience: 0.05 }
    incoming: { trust: 0.06, respect: 0.03, intimacy: 0.03, salience: 0.07 }
  action.confront:
    outgoing: { salience: 0.10, intimacy: -0.01 }
    incoming: { trust: -0.05, resentment: 0.06, salience: 0.10 }
  # stage 전이 행동 (ADR-016: 전이는 stage_after_action이 판정) — 여기는 차원에
  # 남는 흔적만: 고백은 마음을 흔들고(받은 쪽이 더 크게), 절교는 벤다
  action.confess:
    outgoing: { intimacy: 0.04, salience: 0.12 }
    incoming: { attraction: 0.05, intimacy: 0.04, salience: 0.15 }
  action.sever:
    outgoing: { intimacy: -0.05, salience: 0.12 }
    incoming: { trust: -0.08, resentment: 0.10, intimacy: -0.06, salience: 0.15 }

# 감정 응고 (ADR-016 갱신 규칙 2): 대상 있는 감정 인스턴스 → 차원 반영.
# 델타 = 계수 × 감정 강도. 반복 anger → resentment 누적이 핵심 서사 장치.
emotion_consolidation:
  gratitude: { trust: 0.05, intimacy: 0.03 }
  joy: { intimacy: 0.02 }
  anger: { resentment: 0.08, trust: -0.06 }
  distress: { intimacy: -0.02 }

# 시간 감쇠 (ADR-016 갱신 규칙 4, tick당): 상호작용 없으면 서서히 —
# resentment는 매우 느리게 (화해 후에도 남는 앙금)
decay_per_tick:
  intimacy: 0.0003
  salience: 0.0006
  resentment: 0.000002  # 세계 1일(1440 tick)에 0.003 — 잊히지만 사라지지 않는다

# 인물 통찰(person_insight, ADR-008 reflection) 응고: salience += 계수 × 확신.
# 차원은 안 바뀐다 — 생각만으로 마음이 바뀌진 않지만, 그 사람의 비중은 는다
insight_salience: 0.05

# stage 전이 판정 (ADR-016 stage_after_action) — confess 수락의 문턱.
# 답은 대상→행위자 엣지가 정한다: 신뢰가 닿아 있고, 앙금이 답을 막지 않아야 한다
stage_transitions:
  confess_accept_trust: 0.2
  confess_reject_resentment: 0.3

# 발행 임계 (ADR-016 갱신 규칙 5): 직전 발행 이후 누적 |델타| L1 합이
# 이 값을 넘을 때만 relationship.state.changed 발행
publish_threshold: 0.08

# sparse 상한 (ADR-016 리스크): 액터당 활성 관계 — 초과 시 최저 salience 휴면화
max_active_edges: 150
