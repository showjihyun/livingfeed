[project]
name = "lf-director"
version = "0.1.0"
description = "Director AI — 서사 관찰 + 제한된 간접 개입 (ADR-013)"
requires-python = ">=3.12"
dependencies = [
    "lf-schemas",
]

[tool.uv.sources]
lf-schemas = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_director"]
