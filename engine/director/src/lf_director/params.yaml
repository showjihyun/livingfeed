# Director AI 파라미터 — 단일 파일 (ADR-013: Drama Score 구성요소는 설정화)
# 리플레이 기반 오프라인 튜닝 대상. 코드에 수치 하드코딩 금지.

# 관찰: 이벤트 → drama 기여도 (침체 감지의 재료)
drama_contribution:
  actor.action.performed:
    base_by_kind:
      confront: 0.8
      help: 0.3
      speak: 0.2
    default: 0.05
    target_multiplier: 1.3   # 대인 사건이 더 극적이다
  actor.emotion.shifted:
    # 세계 상주 실행(2026-07-17)의 튜닝: 0.5는 만성 목표결핍 distress(0.7~0.9,
    # 행동 tick마다 재적재)만으로 임계(0.2)를 넘겨 침체 감지가 영원히 포화했다 —
    # 내면 상태의 재진술은 서사가 아니다. 0.15면 만성 재진술(≈0.13)은 임계 아래,
    # 사건성 복합 신호(갈등+감정+편집 통과)는 여전히 임계를 넘는다.
    intensity_weight: 0.15   # 최고 감정 강도 × 계수
  feed.post.published:
    drama_weight: 0.3        # 편집 통과 자체가 서사 신호다

# 침체 감지: 최근 창의 tick당 drama 이동평균이 임계 미만으로 N tick 지속
observation:
  window_ticks: 30
  quiet_threshold: 0.2
  quiet_ticks_to_fire: 30

# 개입 예산 (hard rule, ADR-013): 창(세계 1시간 = 60 tick)당 상한 +
# 같은 correlation 사슬 연속 개입 금지
budget:
  window_ticks: 60
  max_interventions: 2

# Narrative Gravity (ADR-013 §관찰) — 플레이어 관심의 롤링 창.
# 시선이 쏠린 인물의 긴장 쌍이 개입 후보의 앞줄로 온다 (순서만 — 후보 집합 불변)
gravity:
  window_ticks: 360   # 세계 하루 — 어제의 시선까지가 오늘의 무대다

# boost_feed — 편집 조명 (ADR-013/014): LLM·규칙은 대상만 고른다, 강도·기간은 노브다
# (행동 반경 제한 — 조명의 세기를 모델이 정하게 두지 않는다)
boost:
  strength: 0.6        # worthiness boost 항 (incident의 1.0보다 약한 상시 조명)
  duration_ticks: 60   # 세계 1시간 — 조명은 영원하지 않다

# 회고 → 페이싱 자기 조정 (비례 제어의 첫 절단면, ADR-013 회고 후속).
# 지난 날 드라마 개입 밀도가 목표 대역을 벗어나면 quiet_ticks_to_fire를
# 한 걸음씩 움직인다 — 시즌 테마가 기조라면 이건 미세 조정이다.
retrospect_tuning:
  target_interventions_per_day: 6   # 세계 하루(360 tick) 기준 드라마 개입 목표
  adjust_step: 5                    # 한 번에 움직이는 quiet_ticks_to_fire 폭
  quiet_ticks_min: 6                # 몰아쳐도 이 아래로는 안 내려간다
  quiet_ticks_max: 60               # 참아도 이 위로는 안 올라간다

# inject_incident 라이브러리 — 같은 도구 반복의 기계감 방지를 위해 순환한다.
# description의 {a}/{b}는 갈등 후보 쌍(그래프 tension 질의)으로 채워진다.
incidents:
  - kind: chance_encounter
    description: "동네 카페의 정전 — 촛불 아래, 피하고 싶던 사람들이 같은 테이블에 앉게 됐다"
    location_id: loc_cafe_luna
    intensity: 0.65
  - kind: rumor_spread
    description: "누군가의 대화가 잘못 전해졌다 — 사무실에 출처 불명의 소문이 돌기 시작한다"
    location_id: loc_newsroom
    intensity: 0.55
  - kind: deadline_crunch
    description: "예고 없던 마감 단축 — 모두의 계획이 하루 앞으로 당겨졌다"
    location_id: loc_newsroom
    intensity: 0.5
  - kind: sudden_rain
    description: "갑작스런 폭우 — 우산 없는 사람들이 같은 처마 밑으로 모여들었다"
    location_id: null
    intensity: 0.4

# set_season_theme 라이브러리 — 시즌 페이싱(갈등 빈도) 테마 (ADR-013).
# 각 테마는 개입 빈도 노브를 조정한다: quiet_ticks_to_fire(침체를 얼마나 참는가,
# 낮을수록 더 자주 개입) + max_interventions(창당 개입 상한). LLM은 이 목록에서만 고른다.
season_themes:
  - name: calm
    quiet_ticks_to_fire: 45   # 느긋하게 — 웬만하면 세계에 맡긴다
    max_interventions: 1
  - name: rising_tension
    quiet_ticks_to_fire: 20   # 침체를 덜 참는다 — 더 자주 불씨를 놓는다
    max_interventions: 3
  - name: turmoil
    quiet_ticks_to_fire: 12   # 격동 — 몰아친다
    max_interventions: 4
