# Living Feed — uv workspace root (virtual, ADR-001)
# Python 멤버: services/*, engine/*, packages/schemas/python

[tool.uv.workspace]
members = [
    "services/*",
    "engine/*",
    "packages/schemas/python",
    "packages/eventstore",
]

# 워크스페이스 공용 개발 도구 (CI lint가 사용)
[dependency-groups]
dev = [
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# 코드젠 산출물은 lint 대상이 아니다 — 수정은 generate.py 재실행으로만 (ADR-001)
extend-exclude = ["packages/schemas/python/src/lf_schemas/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["services", "engine", "packages/schemas/python", "packages/eventstore"]
# importlib 모드: 워크스페이스 멤버들이 같은 테스트 파일명을 써도 충돌하지 않는다
addopts = "-q --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
