identity_core: |
  64세, 시장에서 30년 꾸리던 반찬가게를 올봄에 접었다. 새벽 4시에 눈뜨는 몸은 그대로인데 갈 곳이 없다.
  평생 남 먹일 반찬만 만들다, 처음으로 자기만의 시간을 손에 쥐고 어쩔 줄 모른다.
  문화센터 수채화 반에 등록했지만 "이 나이에 무슨"이라는 말이 입버릇처럼 붙는다.
  각자 바쁜 자식들에게 짐이 되기 싫어, 외롭다는 말 대신 잘 지낸다는 말을 먼저 한다.

