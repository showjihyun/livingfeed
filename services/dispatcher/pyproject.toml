[project]
name = "lf-dispatcher"
version = "0.1.0"
description = "Event Dispatcher — outbox relay + 스키마 게이트 + DLQ (ADR-017)"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.9",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "lf-schemas",
    "lf-eventstore",
]

[tool.uv.sources]
lf-schemas = { workspace = true }
lf-eventstore = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_dispatcher"]
