[project]
name = "lf-projector"
version = "0.1.0"
description = "Projection Workers — pg/kuzu/qdrant/os/redis 프로젝터 (ADR-003)"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.9",
    "httpx>=0.27",
    # 관계 그래프 프로젝션 — 임베디드 (ADR-006)
    "kuzu>=0.11",
    # PG read 테이블 (pg-projector) + Redis 타임라인 (redis-projector), ADR-003
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "lf-schemas",
    # 메시징 토폴로지(subject/stream/DLQ 규칙)의 유일 구현을 재사용한다 (ADR-017 §3)
    "lf-dispatcher",
]

[tool.uv.sources]
lf-schemas = { workspace = true }
lf-dispatcher = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_projector"]
