[project]
name = "lf-projector"
version = "0.1.0"
description = "Projection Workers — pg/kuzu/qdrant/os/redis 프로젝터 (ADR-003)"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.9",
    "lf-schemas",
]

[tool.uv.sources]
lf-schemas = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_projector"]
