[project]
name = "lf-feed-api"
version = "0.1.0"
description = "Feed 조회 API — ADR-014 (배치/랭킹 읽기 경로)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "lf-schemas",
]

[tool.uv.sources]
lf-schemas = { workspace = true }
lf-projector = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    # 통합 테스트에서 OpenSearch 인덱스를 시드하기 위한 dev 전용 의존
    "lf-projector",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_feed_api"]
