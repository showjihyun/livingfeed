[project]
name = "lf-feed-api"
version = "0.1.0"
description = "Feed 조회 API — ADR-014 (배치/랭킹 읽기 경로)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "nats-py>=2.9",
    # PG read 테이블 조회 — 프로필/대화 히스토리 (ADR-003 pg-projector의 읽기 짝)
    "psycopg[binary,pool]>=3.2",
    "lf-schemas",
    # graph query API 클라이언트 — 관계 근접도 랭킹 항 (ADR-006/014).
    # kuzu 자체는 런타임에 임포트되지 않는다 (graph_api는 경량 임포트)
    "lf-projector",
]

[tool.uv.sources]
lf-schemas = { workspace = true }
lf-projector = { workspace = true }
lf-eventstore = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    # /story 통합 테스트의 es 시딩 — 런타임은 es를 read-only SELECT만 한다 (story.py)
    "lf-eventstore",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_feed_api"]
