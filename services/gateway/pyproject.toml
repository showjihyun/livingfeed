[project]
name = "lf-gateway"
version = "0.1.0"
description = "API Gateway + Transport Layer (SSE/WS) — ADR-010"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "nats-py>=2.9",
    "redis>=5.0",
    # 페르소나 스튜디오 관리 API — agents/personas yaml(SoT) 읽기/쓰기
    "pyyaml>=6",
    # 서사 푸시 발송 (plan/11 §D1) — VAPID 서명 Web Push. 동반 py-vapid의
    # `vapid` CLI로 키를 만든다 (config.py 주석 참고, 실키 커밋 금지)
    "pywebpush>=2.0",
    "lf-schemas",
    # WS 세션이 player.* 이벤트를 적재한다 (ADR-010/017 — append가 유일한 쓰기 경로)
    "lf-eventstore",
    # graph query API 클라이언트 (ADR-006) — kuzu 자체는 런타임에 임포트되지 않는다
    "lf-projector",
]

[tool.uv.sources]
lf-schemas = { workspace = true }
lf-eventstore = { workspace = true }
lf-dispatcher = { workspace = true }
lf-projector = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    # 통합 테스트에서 JetStream 스트림 프로비저닝을 재사용하기 위한 dev 전용 의존
    "lf-dispatcher",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_gateway"]
