[project]
name = "lf-gateway"
version = "0.1.0"
description = "API Gateway + Transport Layer (SSE/WS) — ADR-010"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "nats-py>=2.9",
    "redis>=5.0",
    "lf-schemas",
    # WS 세션이 player.* 이벤트를 적재한다 (ADR-010/017 — append가 유일한 쓰기 경로)
    "lf-eventstore",
]

[tool.uv.sources]
lf-schemas = { workspace = true }
lf-eventstore = { workspace = true }
lf-dispatcher = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    # 통합 테스트에서 JetStream 스트림 프로비저닝을 재사용하기 위한 dev 전용 의존
    "lf-dispatcher",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_gateway"]
