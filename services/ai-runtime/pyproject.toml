[project]
name = "lf-ai-runtime"
version = "0.1.0"
description = "AI Runtime — LLM/임베딩 단일 통제 지점 (ADR-018)"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.9",
    "jsonschema>=4.23",
    "anthropic>=0.116",
    "lf-schemas",
]

[tool.uv.sources]
lf-schemas = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_ai_runtime"]
