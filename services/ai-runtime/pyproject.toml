[project]
name = "lf-ai-runtime"
version = "0.1.0"
description = "AI Runtime — LLM/임베딩 단일 통제 지점 (ADR-018)"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.9",
    "jsonschema>=4.23",
    "anthropic>=0.116",
    "openai>=1.60",
    # 예산·레이트 카운터의 공유 저장소 (budget.py) — 무상태 다중 인스턴스에서
    # 세계 단위 상한을 집행하려면 카운터가 프로세스 밖에 있어야 한다 (ADR-019)
    "redis>=5.0",
    "lf-schemas",
]

[tool.uv.sources]
lf-schemas = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_ai_runtime"]
