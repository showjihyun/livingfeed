[project]
name = "lf-eventstore"
version = "0.1.0"
description = "이벤트 스토어 + transactional outbox — 세계 역사의 유일한 쓰기 경로 (ADR-002/005)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "jsonschema>=4.23",
    "lf-schemas",
]

[tool.uv.sources]
lf-schemas = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_eventstore"]
