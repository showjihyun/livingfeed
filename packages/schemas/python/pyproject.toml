[project]
name = "lf-schemas"
version = "0.1.0"
description = "Living Feed 이벤트/API 스키마 — 코드젠 산출물 패키지 (ADR-001/002/017)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.23",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lf_schemas"]
