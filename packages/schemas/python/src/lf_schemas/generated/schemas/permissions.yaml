# 발행 권한 매트릭스 (ADR-017 §2)
# dispatcher가 outbox 적재/발행 시점에 검증한다.
# 규칙: principal(발행 주체) → 허용 이벤트 타입 패턴 목록 (접두 와일드카드만 허용)
#
# ★ engine.director 에 actor.* / relationship.* 이 없는 것은 의도된 것이다 —
#   Director는 간접 개입만 가능하다 (ADR-013 hard rule).

principals:
  engine.tick:
    - "system.tick.*"
  engine.actor:
    - "actor.*"
  engine.relationship:
    - "relationship.*"
  engine.emotion:
    - "actor.emotion.*"
  engine.goal:
    - "actor.goal.*"
  engine.director:
    - "world.*"
    - "system.director.*"
  engine.feed:
    - "feed.*"
  services.gateway:
    - "player.*"
    # 스튜디오 은퇴(DELETE)의 이벤트화 — gateway가 발행하는 actor.* 이벤트 둘 중 하나.
    # 접두 와일드카드가 아니라 정확한 타입만 — 액터의 삶은 engine.actor의 몫이다.
    - "actor.identity.retired"
    # 복원(returned)도 스튜디오의 결정이다 — 은퇴의 역방향, 같은 저자성 (재사영은 프로젝터의 몫).
    - "actor.identity.returned"
    # 세계 분기의 자기 진술 (ADR-021 §4 L4) — 운영자 조작이라 관리 표면이 발행한다.
    # system.director.*와 달리 서사가 아니라 실험 설계의 사실이다.
    - "system.world.forked"
  services.ai-runtime: []        # AI Runtime은 이벤트를 발행하지 않는다 (ADR-018)
  services.projector: []         # 프로젝터는 절대 발행하지 않는다 (ADR-003 계약 4)
