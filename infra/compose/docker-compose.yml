# Living Feed 개발환경 (ADR-019 §환경 구성)
#
#   docker compose --profile core up -d          # 저장소 6종만 — 서비스는 호스트에서 실행
#   docker compose --profile full up -d --build  # + 서비스 컨테이너 (gateway, feed-api, dispatcher, ai-runtime, tick, feed-composer, projector)
#   docker compose down                          # 중지 (데이터 볼륨 유지)
#   docker compose down -v                       # 데이터까지 삭제
#
# 자격증명 기본값은 개발 전용이다. 재정의: .env.example → .env 복사 후 수정.

name: livingfeed

services:
  # ── 저장소 (profile: core) ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    profiles: [core, full]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livingfeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livingfeed}
      POSTGRES_DB: ${POSTGRES_DB:-livingfeed}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livingfeed} -d ${POSTGRES_DB:-livingfeed}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    profiles: [core, full]
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  nats:
    # dev는 단일 노드, prod는 3-node R3 클러스터 (ADR-004)
    image: nats:2.10-alpine
    profiles: [core, full]
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  nats-test:
    # 테스트 전용 JetStream — 파괴적 픽스처(LF_* 스트림 삭제)의 유일한 표적.
    # 상주 세계의 nats(4222)와 분리한다 (2026-07-17 스트림 전소 사고의 격리).
    # 저장 볼륨 없음 — 내용은 소모품이고, 재기동이 곧 초기화다.
    image: nats:2.10-alpine
    profiles: [core, full]
    restart: unless-stopped
    command: ["-js"]
    ports:
      - "4223:4222"

  qdrant:
    image: qdrant/qdrant:v1.12.1
    profiles: [core, full]
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    # 이미지에 shell/curl이 없어 컨테이너 내부 healthcheck 불가 — 호스트에서 GET /readyz 로 확인

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    profiles: [core, full]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18

  minio:
    image: minio/minio:latest   # TODO: 첫 배포 전 RELEASE 태그로 고정
    profiles: [core, full]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-livingfeed}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-livingfeed}
    ports:
      - "${MINIO_PORT:-9000}:9000"           # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── 서비스 (profile: full) ───────────────────────────────────────────
  gateway:
    profiles: [full]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
      args:
        PACKAGE: lf-gateway
        APP_MODULE: lf_gateway.main:app
    ports:
      - "8000:8000"
    environment:
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      # WS 세션이 player.* 이벤트를 적재한다 (ADR-010/017)
      LF_PG_DSN: postgresql://${POSTGRES_USER:-livingfeed}:${POSTGRES_PASSWORD:-livingfeed}@postgres:5432/${POSTGRES_DB:-livingfeed}
      LF_ENV: dev
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 6

  feed-api:
    profiles: [full]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
      args:
        PACKAGE: lf-feed-api
        APP_MODULE: lf_feed_api.main:app
    ports:
      - "8001:8000"
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      REDIS_URL: redis://redis:6379/1
      # PG read 테이블(프로필/대화, pg-projector 산출물) — 미가용이면 해당 경로만 503
      LF_DATABASE_URL: postgresql://${POSTGRES_USER:-livingfeed}:${POSTGRES_PASSWORD:-livingfeed}@postgres:5432/${POSTGRES_DB:-livingfeed}
      # graph query API(관계 근접도 랭킹 항) — 미가용이면 근접도 항 없이 동작
      NATS_URL: nats://nats:4222
    depends_on:
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 6

  dispatcher:
    profiles: [full]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
      args:
        PACKAGE: lf-dispatcher
        APP_MODULE: unused   # uvicorn 대상이 아니다 — command로 대체
    command: ["python", "-m", "lf_dispatcher.main"]
    environment:
      LF_PG_DSN: postgresql://${POSTGRES_USER:-livingfeed}:${POSTGRES_PASSWORD:-livingfeed}@postgres:5432/${POSTGRES_DB:-livingfeed}
      NATS_URL: nats://nats:4222
      LF_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  ai-runtime:
    profiles: [full]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
      args:
        PACKAGE: lf-ai-runtime
        APP_MODULE: unused   # uvicorn 대상이 아니다 — command로 대체
    command: ["python", "-m", "lf_ai_runtime.main"]
    environment:
      NATS_URL: nats://nats:4222
      LF_ENV: dev
      # 기본은 규칙 프로바이더 — LLM 사용 시 LF_AI_PROVIDER + 해당 API 키 (.env)
      # 지원: rule | local | anthropic | openai | gemini | deepseek | glm (services/ai-runtime/README.md)
      LF_AI_PROVIDER: ${LF_AI_PROVIDER:-rule}
      LF_MODEL_ROUTES: ${LF_MODEL_ROUTES:-}
      # local: 호스트에서 도는 Ollama/LM Studio — 컨테이너에서는 host.docker.internal 경유
      LF_LOCAL_BASE_URL: ${LF_LOCAL_BASE_URL:-http://host.docker.internal:11434/v1}
      LF_LOCAL_MODEL: ${LF_LOCAL_MODEL:-}
      LF_OPENAI_REASONING_EFFORT: ${LF_OPENAI_REASONING_EFFORT:-low}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux에서도 호스트 Ollama 접근 가능하게
    depends_on:
      nats:
        condition: service_healthy

  tick:
    # 액터가 실린 tick 워커 (ADR-011/012) — 로드맵 6단계부터 lf_actor.main이 엔트리다
    profiles: [full]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
      args:
        PACKAGE: lf-actor
        APP_MODULE: unused   # uvicorn 대상이 아니다 — command로 대체
    command: ["python", "-m", "lf_actor.main"]
    environment:
      LF_PG_DSN: postgresql://${POSTGRES_USER:-livingfeed}:${POSTGRES_PASSWORD:-livingfeed}@postgres:5432/${POSTGRES_DB:-livingfeed}
      NATS_URL: nats://nats:4222
      LF_REDIS_URL: redis://redis:6379/0
      LF_ENV: dev
      LF_WORLD_ID: w_main
      LF_PERSONAS_DIR: /app/agents/personas
      # 세계 규모 — 깨울 액터 수(10~1000). 미설정이면 시드 전원(현재 100명).
      # 20명 이상은 40B 이상 모델 권장 (capacity.py / scripts/actor_capacity.py).
      LF_MAX_ACTORS: ${LF_MAX_ACTORS:-}
      # 로컬 LLM 모델 파라미터(B) — 알려주면 부팅 로그가 하한 위반을 경고한다 (선택)
      LF_MODEL_PARAMS_B: ${LF_MODEL_PARAMS_B:-}
      LF_AI_TIMEOUT_S: ${LF_AI_TIMEOUT_S:-18}
      # Semantic 기억 (ADR-008) — 미가용이어도 tick은 흐른다 (회상만 비활성)
      LF_QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  feed-composer:
    # 편집 1단: LF_ACTOR 소비 → feed-worthiness → feed.post.published 적재 (ADR-014)
    profiles: [full]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
      args:
        PACKAGE: lf-feed
        APP_MODULE: unused   # uvicorn 대상이 아니다 — command로 대체
    command: ["python", "-m", "lf_feed.main"]
    environment:
      LF_PG_DSN: postgresql://${POSTGRES_USER:-livingfeed}:${POSTGRES_PASSWORD:-livingfeed}@postgres:5432/${POSTGRES_DB:-livingfeed}
      NATS_URL: nats://nats:4222
      LF_ENV: dev
      LF_PERSONAS_DIR: /app/agents/personas
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  projector:
    # 배치 2단 저장: LF_FEED → OpenSearch 색인 (os-projector, ADR-003/014)
    # 재구축(일회성): docker compose run --rm projector python -m lf_projector.main --kind os --rebuild --once
    profiles: [full]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
      args:
        PACKAGE: lf-projector
        APP_MODULE: unused   # uvicorn 대상이 아니다 — command로 대체
    command: ["python", "-m", "lf_projector.main", "--kind", "os"]
    environment:
      NATS_URL: nats://nats:4222
      OPENSEARCH_URL: http://opensearch:9200
      LF_ENV: dev
    depends_on:
      nats:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  director:
    # Director AI — 서사 관찰 + 제한된 간접 개입 (ADR-013). 세계당 1 인스턴스.
    profiles: [full]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
      args:
        PACKAGE: lf-director
        APP_MODULE: unused   # uvicorn 대상이 아니다 — command로 대체
    command: ["python", "-m", "lf_director.main"]
    environment:
      LF_PG_DSN: postgresql://${POSTGRES_USER:-livingfeed}:${POSTGRES_PASSWORD:-livingfeed}@postgres:5432/${POSTGRES_DB:-livingfeed}
      NATS_URL: nats://nats:4222
      LF_ENV: dev
      LF_WORLD_ID: w_main
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  kuzu-projector:
    # 관계 그래프 프로젝션 + graph query API (ADR-006) — Kuzu는 임베디드(볼륨에 DB 파일)
    # 재구축(일회성): docker compose run --rm kuzu-projector python -m lf_projector.main --kind kuzu --rebuild --once
    profiles: [full]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
      args:
        PACKAGE: lf-projector
        APP_MODULE: unused   # uvicorn 대상이 아니다 — command로 대체
    command: ["python", "-m", "lf_projector.main", "--kind", "kuzu"]
    environment:
      NATS_URL: nats://nats:4222
      LF_ENV: dev
      LF_KUZU_DIR: /data/kuzu
      # 소비에는 불필요 — --verify(원천 es 대비 그래프 비교)가 쓴다
      LF_DATABASE_URL: postgresql://${POSTGRES_USER:-livingfeed}:${POSTGRES_PASSWORD:-livingfeed}@postgres:5432/${POSTGRES_DB:-livingfeed}
    volumes:
      - kuzu_data:/data/kuzu
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy

  pg-projector:
    # PG read 테이블: 에피소드·신념·대화 (ADR-003, ADR-008 후속)
    # 재구축(일회성): docker compose run --rm pg-projector python -m lf_projector.main --kind pg --rebuild --once
    profiles: [full]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
      args:
        PACKAGE: lf-projector
        APP_MODULE: unused   # uvicorn 대상이 아니다 — command로 대체
    command: ["python", "-m", "lf_projector.main", "--kind", "pg"]
    environment:
      NATS_URL: nats://nats:4222
      LF_DATABASE_URL: postgresql://${POSTGRES_USER:-livingfeed}:${POSTGRES_PASSWORD:-livingfeed}@postgres:5432/${POSTGRES_DB:-livingfeed}
      LF_ENV: dev
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis-projector:
    # Redis 타임라인: 관계 기반 fan-out-on-write — Personal/Private 피드 (ADR-014 §2단)
    # 재구축(일회성): docker compose run --rm redis-projector python -m lf_projector.main --kind redis --rebuild --once
    profiles: [full]
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.python
      args:
        PACKAGE: lf-projector
        APP_MODULE: unused   # uvicorn 대상이 아니다 — command로 대체
    command: ["python", "-m", "lf_projector.main", "--kind", "redis"]
    environment:
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/1
      LF_ENV: dev
      # 소비에는 불필요 — --verify(원천 es의 팔로우 선언 fold)가 쓴다
      LF_DATABASE_URL: postgresql://${POSTGRES_USER:-livingfeed}:${POSTGRES_PASSWORD:-livingfeed}@postgres:5432/${POSTGRES_DB:-livingfeed}
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # qdrant 프로젝터는 자신의 로드맵 단계에서 추가된다.

volumes:
  pg_data:
  redis_data:
  nats_data:
  qdrant_data:
  opensearch_data:
  kuzu_data:
  minio_data:
